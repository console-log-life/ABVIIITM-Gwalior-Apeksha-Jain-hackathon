# Stress scenarios — ILLUSTRATIVE starting values (spec 8.3), not calibrated to history.
# Simplified, illustrative hackathon stress model. Not a production or regulatory risk model.
#
# Units: rates_bp / ig_spread_bp / hy_spread_bp in basis points; equity_pct / em_fx_pct as decimals
# (-0.12 = -12%); pd_multiplier multiplies 1-year PDs. em_fx_pct is the move of EM currencies (INR) vs USD.

rating_spread_scaling:      # spread shock per rating bucket = factor x (IG or HY) shock
  AAA-AA: {base: ig, factor: 0.5}
  A: {base: ig, factor: 0.8}
  BBB: {base: ig, factor: 1.0}
  BB: {base: hy, factor: 1.0}
  B-or-below: {base: hy, factor: 1.3}

pd_sensitivity:             # bucket PD multiplier = 1 + (scenario pd_multiplier - 1) x sensitivity
  AAA-AA: 0.5
  A: 0.75
  BBB: 1.0
  BB: 1.25
  B-or-below: 1.5

scenarios:
  geopolitical_severe:
    label: Geopolitical shock (severe)
    rationale: "Flight to quality lowers rates while credit spreads gap wider, equities sell off and EM currencies weaken."
    shocks: {rates_bp: -25, ig_spread_bp: 100, hy_spread_bp: 300, equity_pct: -0.12, em_fx_pct: -0.05, pd_multiplier: 1.5}
  geopolitical_moderate:
    label: Geopolitical shock (moderate)
    rationale: "Contained conflict or sanctions headline: milder risk-off with the same direction of moves."
    shocks: {rates_bp: -10, ig_spread_bp: 50, hy_spread_bp: 150, equity_pct: -0.06, em_fx_pct: -0.025, pd_multiplier: 1.2}
  macro_rate_shock_severe:
    label: Macro rate shock (severe)
    rationale: "Inflation surprise forces aggressive tightening: rates jump, duration and credit both lose."
    shocks: {rates_bp: 200, ig_spread_bp: 75, hy_spread_bp: 250, equity_pct: -0.10, em_fx_pct: -0.03, pd_multiplier: 1.3}
  macro_rate_shock_moderate:
    label: Macro rate shock (moderate)
    rationale: "Hawkish repricing of the policy path: half the severe move."
    shocks: {rates_bp: 100, ig_spread_bp: 40, hy_spread_bp: 120, equity_pct: -0.05, em_fx_pct: -0.015, pd_multiplier: 1.15}
  systemic_credit_severe:
    label: Systemic credit event (severe)
    rationale: "Broad default wave: spreads blow out, PDs double, equities fall; rates unchanged."
    shocks: {rates_bp: 0, ig_spread_bp: 150, hy_spread_bp: 500, equity_pct: -0.08, em_fx_pct: -0.02, pd_multiplier: 2.0}
  systemic_credit_moderate:   # added: the spec table has no moderate credit scenario; half of severe
    label: Systemic credit event (moderate)
    rationale: "Credit scare without a default wave: roughly half the severe spread and PD moves."
    shocks: {rates_bp: 0, ig_spread_bp: 75, hy_spread_bp: 250, equity_pct: -0.04, em_fx_pct: -0.01, pd_multiplier: 1.5}
  idiosyncratic_credit:
    label: Idiosyncratic credit event (single issuer)
    rationale: "Issuer-specific downgrade/default risk: only the named issuer's bonds, loans, equity and CDS move."
    issuer_only: true
    shocks: {rates_bp: 0, ig_spread_bp: 300, hy_spread_bp: 600, equity_pct: -0.25, em_fx_pct: 0.0, pd_multiplier: 3.0}

# Trigger -> scenario family mapping (triggers.py); severity suffix _moderate / _severe from the impact score.
systemic_family:
  Geopolitical: geopolitical
  Macroeconomic: macro_rate_shock
  Credit Event: systemic_credit
