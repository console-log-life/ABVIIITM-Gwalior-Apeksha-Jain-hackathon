[project]
name = "risk-signal-engine"
version = "0.1.0"
description = "AI/NLP financial risk signal engine with downstream portfolio stress testing (hackathon MVP)"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "model: requires downloaded model weights (run src/scripts/setup_models.py first)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# generated for Kaggle/Colab (Python 3.10); smoke-tested by running it (see src/scripts/build_training_notebook.py)
extend-exclude = ["src/notebooks"]
src = ["src", "src/scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency/parameter markers are designed to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path", "fastapi.File"]
