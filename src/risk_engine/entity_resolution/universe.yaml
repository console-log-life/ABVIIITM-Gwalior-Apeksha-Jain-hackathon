# Issuer universe for entity resolution (25 issuers).
# rating_bucket values are ILLUSTRATIVE approximations for the hackathon stress model — NOT official ratings.
#
# aliases:            matched case-insensitively on word boundaries, no extra condition.
# ambiguous_aliases:  common words / brand names that only count when a context keyword appears in the same
#                     text (see context_keywords + per-issuer context) or the document carries a matching
#                     ticker hint. e.g. "apple pie recipe" must NOT resolve to AAPL.

context_keywords: [stock, stocks, share, shares, shareholder, shareholders, investor, investors, company, companies,
  ceo, cfo, chief executive, earnings, revenue, revenues, profit, profits, quarter, quarterly, results, guidance,
  supplier, suppliers, inc, corp, corporation, ltd, limited, plc, nasdaq, nyse, nse, bse, sensex, nifty,
  market cap, valuation, analyst, analysts, downgrade, upgrade, rating, bond, bonds, debt, lawsuit, sues, sued,
  antitrust, regulator, regulators, probe, fine, deal, acquisition, merger, layoffs, sales, dividend, buyback,
  ipo, launch, launches, unveils, recall, factory, plant, chips, ai]

