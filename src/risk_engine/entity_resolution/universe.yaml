# ---------------- Curated issuer links (risk propagation, src/portfolio/propagation.py) ----------------
# CURATED BY HAND from well-known public relationships; NOT inferred from data and not exhaustive. Used only for the
# second-order ("propagated") exposure view and the watchlist propagation rule. Links are treated as two-way for
# contagion (a supplier's disruption hits its customers; a customer's distress hits its supplier's revenue).
# Decay factors per relation are in config (PROPAGATION_DECAY). Related names that are not separate issuers in this
# universe are covered by aliases instead: "Jaguar Land Rover"/"JLR" resolve to Tata Motors, "Adani Group" to Adani
# Enterprises. Apple's main suppliers (TSMC, Foxconn) are not in the universe, so Apple has no supplier link.
links:
  - {a: US-NVDA, b: US-MSFT, relation: supplier_of, note: "Nvidia data-centre GPUs for Microsoft Azure AI capacity"}
  - {a: US-NVDA, b: US-META, relation: supplier_of, note: "Nvidia GPUs in Meta's AI training clusters"}
  - {a: US-NVDA, b: US-AMZN, relation: supplier_of, note: "Nvidia GPUs in AWS instances"}
  - {a: US-NVDA, b: US-GOOGL, relation: supplier_of, note: "Nvidia GPUs in Google Cloud instances"}
