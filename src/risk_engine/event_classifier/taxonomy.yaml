# Rule-based event taxonomy (spec 6.3). Patterns are case-insensitive regexes matched on word boundaries
# (the classifier wraps each one in (?<![A-Za-z0-9])...(?![A-Za-z0-9])). Score = sum of weights of DISTINCT
# patterns matched. Primary = argmax; ties are broken by the order of classes below (most severe first), or by
# the optional zero-shot model when ENABLE_ZERO_SHOT=true. Secondary = runner-up if >= 60% of primary.
# Weights are expert-set priors, not learned.

secondary_ratio: 0.6
# Used by the STRESS TRIGGERS only (src/portfolio/triggers.py), never by classification: a MARKET-wide
# Geopolitical/Macroeconomic signal needs at least this many DISTINCT evidence cues of that class before it may start a
# systemic stress run. One keyword ("war", "inflation") is not enough to stress the whole book.
market_min_distinct_patterns: 2

# Mapping of the 20 topics in the PUBLIC human-labelled dataset zeroshot/twitter-financial-news-topic (MIT) to our
# 11-class taxonomy. Used ONLY to train/evaluate the learned event classifier (src/risk_engine/training/, src/notebooks/), never
# by the rules. Curated by hand; documented in docs/methodology.md. Known limits:
#   - Litigation is not separable from Regulation in this dataset ("Legal | Regulation" -> Regulatory).
#   - "Treasuries | Corporate Debt" -> Credit Event is BROADER than credit events (bond-market news, not only
#     defaults/downgrades); "Company | Product News" -> Product Launch is noisy (general company news).
#   - IPO -> Other: a listing is a capital-markets event, not a change of control, so it is not M&A.
#   - Supply Chain, Litigation and true Credit Events (defaults/downgrades) have no clean public labels, so the rule
#     engine stays authoritative for those classes (hybrid classifier).
topic_map:
  "Analyst Update": Other
  "Fed | Central Banks": Macroeconomic
  "Company | Product News": Product Launch
  "Treasuries | Corporate Debt": Credit Event
  "Dividend": Earnings
  "Earnings": Earnings
  "Energy | Oil": Macroeconomic
  "Financials": Other
  "Currencies": Macroeconomic
  "General News | Opinion": Other
  "Gold | Metals | Materials": Macroeconomic
  "IPO": Other
  "Legal | Regulation": Regulatory
  "M&A | Investments": M&A
  "Macro": Macroeconomic
  "Markets": Other
  "Politics": Geopolitical
  "Personnel Change": Management
  "Stock Commentary": Other
  "Stock Movement": Other

classes:
  Credit Event:
    - {p: "downgrad(?:e|es|ed|ing)", w: 3}
    - {p: "(?<!by )defaults?|defaulted|defaulting", w: 3}
    - {p: "bankrupt(?:cy|cies)?|chapter 11|insolven(?:t|cy)", w: 3}
    - {p: "miss(?:es|ed)? (?:a |its )?(?:coupon|bond payment|interest payment|debt payment|payment)", w: 3}
    - {p: "rating cuts?|cuts? (?:its |the )?rating", w: 3}
    - {p: "credit ?watch negative|negative watch|placed on watch", w: 2}
    - {p: "(?:negative outlook|outlook (?:cut|revised|lowered) to negative)", w: 2}
    - {p: "debt restructuring|restructur(?:e|es|ing) (?:its |of )?debt", w: 2}
    - {p: "covenant breach(?:es)?|breach(?:es|ed)? (?:of )?(?:its )?covenants?", w: 2}
    - {p: "junk", w: 2}
    - {p: "distressed debt|distressed", w: 2}
    - {p: "liquidity crisis|cash crunch|credit crunch", w: 2}
    - {p: "bad loans|non-performing assets?|npas?", w: 2}
    - {p: "credit ratings?|credit profile", w: 1}
    - {p: "moody's|fitch|s&p global ratings|crisil|icra|care ratings", w: 1}
    - {p: "spreads? widen(?:s|ed|ing)?|widening spreads", w: 2}
    - {p: "write-?downs?|write-?offs?", w: 1}
  Geopolitical:
    # Figurative-use guards: "price war", "talent war", "culture war", ... and "war on <lowercase noun>"
    # ("war on data centres", "war on drugs") are not geopolitical; "war on Ukraine" (proper noun) still is.
    - {p: "(?<!price )(?<!bidding )(?<!talent )(?<!culture )(?<!turf )(?<!streaming )(?<!console )(?<!fare )wars?(?!(?-i: on [a-z]))|wartime", w: 3}
    - {p: "invasion|invad(?:e|es|ed|ing)", w: 3}
    - {p: "sanctions?|sanctioned", w: 3}
    - {p: "missiles?|air ?strikes?|drone strikes?|military strikes?", w: 3}
    - {p: "geopolitic(?:al|s)", w: 3}
    - {p: "coup", w: 3}
    - {p: "terror(?:ist)? attacks?", w: 3}
    - {p: "embargo(?:es)?", w: 3}
    - {p: "trade war", w: 3}
    - {p: "military|troops|army|navy", w: 2}
    - {p: "armed conflict|conflict", w: 2}
    - {p: "border (?:clash(?:es)?|tensions?)", w: 3}
    - {p: "ceasefire|hostilities|escalation|escalat(?:es|ed|ing)", w: 2}
    - {p: "tensions?", w: 1}
    - {p: "nato|united nations|g7|brics", w: 1}
    - {p: "tariffs?", w: 1}
    - {p: "russian?|ukrain(?:e|ian)|taiwan(?:ese)?|china-us|us-china|middle east|iran(?:ian)?|israel(?:i)?|gaza|north korean?|pakistan(?:i)?", w: 1}
  Macroeconomic:
    - {p: "rate (?:hikes?|cuts?|rises?|increases?|decision)", w: 3}
    - {p: "interest rates?", w: 2}
    - {p: "inflation|deflation|stagflation", w: 3}
    - {p: "cpi|consumer prices", w: 3}
    - {p: "gdp|economic growth", w: 3}
    - {p: "recession", w: 3}
    - {p: "federal reserve|fomc|the fed|fed(?= (?:chair|officials?|minutes|signals?|holds?|cuts?|raises?))", w: 3}
    - {p: "central banks?|monetary policy", w: 3}
    - {p: "rbi|repo rate|ecb|bank of england|bank of japan|pboc", w: 2}
    - {p: "jobs report|nonfarm payrolls|payrolls|unemployment(?: rate)?", w: 3}
    - {p: "(?:treasury|bond) yields?|yield curve", w: 2}
    - {p: "pmi|retail sales|industrial output|fiscal deficit|current account", w: 2}
    - {p: "(?:crude )?oil prices?|brent|opec", w: 2}
    - {p: "stimulus|soft landing|hard landing", w: 2}
    - {p: "economy|economic|macro", w: 1}
    - {p: "rupee|dollar index|currency", w: 1}
  Regulatory:
    - {p: "antitrust", w: 3}
    - {p: "probes?|probing", w: 3}
    - {p: "subpoena(?:s|ed)?", w: 3}
    - {p: "sebi", w: 3}
    - {p: "licen[cs]e (?:suspended|revoked|cancelled)", w: 3}
    - {p: "investigations?|investigat(?:e|es|ed|ing)", w: 2}
    - {p: "regulators?|regulatory|watchdog", w: 2}
    - {p: "fined|fines|penalt(?:y|ies)", w: 2}
    - {p: "sec|ftc|doj|department of justice|fca|european commission|cma|cci", w: 2}
    - {p: "bans?|banned|crackdown", w: 2}
    - {p: "fda (?:rejects|warning|approval|approves)", w: 2}
    - {p: "compliance|approval|rules", w: 1}
  Litigation:
    - {p: "lawsuits?|sues|sued|suing", w: 3}
    - {p: "class action", w: 3}
    - {p: "litigation", w: 3}
    # analyst/opinion 'verdict' ("analyst verdict", "our verdict", "strong verdict for X stock", "verdict on the
    # stock") is not litigation; "jury verdict" / "verdict against" still is
    - {p: "(?<!analyst )(?<!analysts )(?<!analyst's )(?<!analysts' )(?<!our )(?<!my )(?<!strong )(?<!final )(?<!market )(?<!investor )(?<!street )(?<!street's )verdict(?! (?:on|for) (?:the |its |this |our |[a-z]+ )?(?:stock|shares|valuation|investors|rally|results))|patent infringement", w: 3}
    - {p: "indict(?:ed|ment)", w: 3}
    - {p: "ruling|jury|judge|damages", w: 2}
    - {p: "settle(?:s|d|ment)? (?:a |the )?(?:lawsuit|case|claims?|charges)|settlement", w: 2}
    - {p: "legal (?:battle|action|challenge)|charged with", w: 2}
    - {p: "fraud", w: 2}
    - {p: "court|appeal(?:s|ed)?", w: 1}
  M&A:
    - {p: "acquir(?:e|es|ed|ing)|acquisitions?", w: 3}
    - {p: "mergers?|merg(?:e|es|ed|ing)", w: 3}
    - {p: "takeover|buyout|tender offer", w: 3}
    - {p: "deal to buy|agrees to buy|to buy .{0,30}(?:stake|company|unit|business)", w: 3}
    - {p: "stake (?:sale|purchase)|buys? (?:a )?stake|acquires? (?:a )?stake", w: 3}
    - {p: "bid for|bids for", w: 2}
    - {p: "divest(?:s|ed|iture|ment)?|spin-?off|carve-?out", w: 2}
    - {p: "joint venture", w: 2}
    - {p: "stake", w: 1}
  Supply Chain:
    - {p: "supply chains?", w: 3}
    - {p: "(?:chip|component|parts|semiconductor) shortages?|shortages?", w: 3}
    - {p: "production (?:halt|halted|stoppage|cut)|halts? production|halted production", w: 3}
    - {p: "(?:factory|plant) (?:fire|shutdown|closure|outage)", w: 3}
    - {p: "shipping (?:disruptions?|delays?)|port congestion|freight rates?", w: 3}
    - {p: "suppliers?", w: 2}
    - {p: "logistics|disruptions?", w: 2}
    - {p: "(?:workers|labou?r|union) strike|strike at", w: 2}
    - {p: "recall(?:s|ed|ing)?", w: 2}
    - {p: "raw materials?|inventor(?:y|ies)", w: 1}
  Earnings:
    - {p: "earnings|eps", w: 3}
    - {p: "beats? (?:estimates|expectations|forecasts)|miss(?:es|ed)? (?:estimates|expectations|forecasts)", w: 3}
    - {p: "q[1-4] results|quarterly results|results", w: 2}
    - {p: "(?:net )?profits?|net income|net loss", w: 2}
    - {p: "revenues?", w: 2}
    - {p: "guidance|forecast(?:s)?", w: 2}
    - {p: "quarter|quarterly", w: 1}
    - {p: "margins?|sales|outlook", w: 1}
  Management:
    - {p: "steps? down|resign(?:s|ed|ation)?", w: 3}
    - {p: "succession|ousted|fired as|executive shake-?up|leadership change", w: 3}
    - {p: "ceo|cfo|coo|chief executive|chief financial officer", w: 2}
    - {p: "appoint(?:s|ed|ment)?|names new|named (?:as )?(?:new )?(?:ceo|chief|head|chair)", w: 2}
    - {p: "chair(?:man|woman|person)?", w: 1}
    - {p: "layoffs|lays off|job cuts", w: 2}
    - {p: "board", w: 1}
  Product Launch:
    - {p: "unveil(?:s|ed|ing)?", w: 3}
    - {p: "launch(?:es|ed|ing)?|rolls? out|rollout", w: 2}
    - {p: "new (?:product|model|phone|iphone|chip|car|vehicle|service|feature)s?", w: 2}
    - {p: "debuts?|introduc(?:es|ed)", w: 2}
    - {p: "lineup|available (?:now|today)|pre-?orders?", w: 1}

# Intensifiers adjust the event-severity factor E (impact scoring), not the class choice.
intensifiers:
  clip: [-0.20, 0.25]
  up:
    - {p: "defaults?|defaulted", adj: 0.15}
    - {p: "bankrupt(?:cy)?", adj: 0.15}
    - {p: "invasion|invad(?:e|es|ed)", adj: 0.15}
    - {p: "(?<!price )(?<!bidding )(?<!talent )(?<!culture )(?<!turf )(?<!streaming )(?<!console )(?<!fare )wars?(?!(?-i: on [a-z]))", adj: 0.10}
    - {p: "sanctions?", adj: 0.10}
    - {p: "collapse[sd]?", adj: 0.15}
    - {p: "fraud", adj: 0.15}
    - {p: "halt(?:s|ed)?", adj: 0.10}
  down:
    - {p: "rumou?rs?|rumou?red", adj: -0.10}
    - {p: "consider(?:s|ing)", adj: -0.10}
    - {p: "may", adj: -0.10, case_sensitive: true}   # lower-case only, so the month "May" is ignored
    - {p: "could", adj: -0.10}
    - {p: "reportedly", adj: -0.10}
    - {p: "talks", adj: -0.10}
